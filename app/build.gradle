plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.pusheralert'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.pusheralert'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.pusher:pusher-java-client:2.4.4'
}
